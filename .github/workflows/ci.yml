name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Acessibilidade dos tokens — bloqueia o merge quando um par reprova.
  # Ver docs/anexos/G-acessibilidade.md (G.3, G.8)
  # ---------------------------------------------------------------------------
  acessibilidade-tokens:
    name: Acessibilidade — tokens de cor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Contraste WCAG 2.2 AA e distinção sob daltonismo
        run: node packages/tokens/scripts/validate-contrast.mjs

      - name: Gerar relatório de conformidade
        if: always()
        run: |
          node packages/tokens/scripts/validate-contrast.mjs --json > relatorio-acessibilidade.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-acessibilidade
          path: relatorio-acessibilidade.json

      - name: CSS gerado está sincronizado com a paleta
        run: |
          node packages/tokens/scripts/build-css.mjs
          if ! git diff --exit-code -- packages/tokens/dist/tokens.css; then
            echo "::error::dist/tokens.css está fora de sincronia com palette.json. Rode 'pnpm tokens:build' e faça commit."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Acessibilidade do DOM renderizado em navegador real.
  # O validador de tokens mede cor no JSON; só um navegador mede contraste
  # efetivo, ordem de foco e semântica ARIA (G.8).
  # ---------------------------------------------------------------------------
  acessibilidade-dom:
    name: Acessibilidade — DOM renderizado (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Tipos da aplicação
        run: npx tsc -p apps/web/tsconfig.json

      # Aritmética de tiles e parser de geocodificação: puro, sem navegador e
      # sem rede. Roda antes do build porque falha em segundos e aponta a linha,
      # enquanto o mesmo defeito visto pelo Playwright aparece como um mapa
      # torto num screenshot.
      - name: Unitários puros da aplicação
        run: npm run web:test

      - name: Construir a aplicação
        run: |
          node packages/tokens/scripts/build-css.mjs
          npx vite build apps/web

      - name: axe, teclado, reflow, permissões e regras de domínio
        run: npx playwright test apps/web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/

  # ---------------------------------------------------------------------------
  # Invariantes de domínio contra PostgreSQL real.
  # Não usamos mock: RN-001 é uma exclusion constraint, RN-028 é RLS. Só um
  # banco de verdade prova que funcionam.
  # ---------------------------------------------------------------------------
  invariantes-banco:
    name: Banco — invariantes de domínio
    runs-on: ubuntu-latest

    services:
      postgres:
        # Imagem com PostGIS: cobre também a migração 0008.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: iarx_test

    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client

      - name: Migrações e suíte de invariantes
        working-directory: packages/db
        run: ./scripts/test.sh

      - name: Extensões indispensáveis presentes
        run: |
          # btree_gist é o que torna RN-001 imponível no banco (ver H.8)
          for ext in btree_gist pgcrypto postgis; do
            if ! psql -tAc "select 1 from pg_extension where extname='$ext'" | grep -q 1; then
              echo "::error::extensão $ext ausente — RN-001 e/ou o módulo MAP não podem ser garantidos"
              exit 1
            fi
          done
          echo "extensões verificadas"

  # ---------------------------------------------------------------------------
  # API de domínio contra PostgreSQL real.
  #
  # Mesma razão do job acima: RN-001 é exclusion constraint e RN-028 é RLS. Aqui
  # o que se prova é o outro lado — que a API roda como `iarx_app` (sujeito a
  # RLS), que traduz a recusa do banco em problem+json acionável e que a
  # idempotência sobrevive a reenvio.
  # ---------------------------------------------------------------------------
  api-integracao:
    name: API — integração e invariantes

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar cliente psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client

      - run: npm install --no-audit --no-fund

      - name: Tipos dos contratos e da API
        run: |
          npx tsc -p packages/contracts/tsconfig.json
          npx tsc -p apps/api/tsconfig.json

      - name: Migrações, massa e suíte de integração
        run: apps/api/scripts/testar.sh

  # ---------------------------------------------------------------------------
  # Guardas de segurança específicos da adoção do Supabase (H.2, H.8)
  # ---------------------------------------------------------------------------
  guardas-supabase:
    name: Segurança — guardas do Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: service_role não pode aparecer em código de cliente
        run: |
          # A chave service_role ignora RLS por completo. Se ela vazar para um
          # bundle de frontend, o isolamento entre tenants (RN-028) deixa de
          # existir — e de forma silenciosa.
          alvos="apps/web apps/pwa packages/ui"
          existentes=""
          for d in $alvos; do [ -d "$d" ] && existentes="$existentes $d"; done

          if [ -z "$existentes" ]; then
            echo "nenhum diretório de cliente ainda existe — guarda inativa nesta fase"
            exit 0
          fi

          if grep -rInE 'service_role|SUPABASE_SERVICE_ROLE' $existentes; then
            echo "::error::referência a service_role em código de cliente (ver H.2, regra 2)"
            exit 1
          fi
          echo "nenhuma referência a service_role no código de cliente"

      - name: Toda rota HTTP declara autorização
        run: node apps/api/scripts/verificar-rotas.mjs

      - name: Contexto de tenant só por SET LOCAL / set_config local
        run: |
          # Com pooler em modo transação, um SET de sessão vaza o tenant para a
          # requisição seguinte de outro usuário na mesma conexão (H.5.2). A
          # terceira posição de set_config precisa ser `true` (is_local).
          if grep -rInE "set_config\(\s*'app\.[a-z_]+'\s*,[^)]*,\s*false\s*\)" apps/api/src; then
            echo "::error::set_config de app.* com is_local=false — vazaria o tenant entre requisições"
            exit 1
          fi
          if grep -rInE "\"set +app\.|'set +app\.|\`set +app\." apps/api/src; then
            echo "::error::SET de sessão para app.* encontrado; use set_config(..., true)"
            exit 1
          fi
          echo "contexto de tenant sempre local à transação"

      - name: API não referencia service_role
        run: |
          # A API roda como iarx_app, papel SUJEITO a RLS. Usar service_role no
          # runtime anularia RN-028 silenciosamente (H.2, regra 1).
          if grep -rInE 'service_role|SUPABASE_SERVICE_ROLE' apps/api/src apps/api/scripts; then
            echo "::error::referência a service_role no runtime da API"
            exit 1
          fi
          echo "API não referencia service_role"

      - name: Nenhuma política de escrita para anon/authenticated
        run: |
          # H.2, regra 1: o cliente nunca escreve direto via PostgREST, porque as
          # invariantes de domínio não são expressáveis como política de linha.
          if grep -rInE "create policy.*for (insert|update|delete|all).*to .*(anon|authenticated)" \
               packages/db/supabase/migrations \
             | grep -v 'iarx_app'; then
            echo "::error::política de escrita concedida a anon/authenticated (ver H.2, regra 1)"
            exit 1
          fi
          echo "nenhuma política de escrita para papéis de cliente"

      - name: Toda tabela de negócio tem RLS habilitada
        run: |
          # Detecta tabela criada sem a chamada correspondente de
          # app.habilitar_rls_tenant() — o risco é uma tabela nova ficar
          # acessível por esquecimento.
          cd packages/db/supabase/migrations
          faltando=0
          for tabela in $(grep -hoE 'create table if not exists public\.[a-z_]+' *.sql \
                          | sed 's/.*public\.//' | sort -u); do
            case "$tabela" in
              tenant|audit_log) continue ;;  # políticas próprias, definidas em 0006
            esac
            if ! grep -qE "'$tabela'" 0006_rls.sql && ! grep -qE "habilitar_rls_tenant\('$tabela'" *.sql; then
              echo "::error::tabela public.$tabela criada sem habilitar RLS (ver RN-028)"
              faltando=$((faltando + 1))
            fi
          done
          [ "$faltando" -eq 0 ] && echo "todas as tabelas de negócio têm RLS habilitada"
          exit $faltando

      - name: Política do locatário é restritiva, nunca permissiva
        run: |
          # D-01 exige que o eixo de cliente **restrinja** o de tenant. O
          # PostgreSQL combina políticas permissivas com OU: uma política de
          # cliente esquecida como permissiva abriria acesso em vez de fechar,
          # e o vazamento seria entre locatários do mesmo fornecedor — que no
          # outsourcing costumam ser concorrentes diretos.
          cd packages/db/supabase/migrations
          # Nota: `%I_leitura_cliente` da 0006 é outra coisa — política
          # permissiva de LEITURA no eixo de tenant, para o PostgREST. O alvo
          # aqui é só o sufixo `_cliente`, do eixo de locatário.
          suspeitas=$(grep -nE "create policy [^ ]*[^a-z_]cliente on|create policy %I_cliente on" *.sql || true)
          if [ -n "$suspeitas" ]; then
            if echo "$suspeitas" | grep -qv 'as restrictive'; then
              echo "::error::política de cliente sem AS RESTRICTIVE (ver D-01)"
              echo "$suspeitas"
              exit 1
            fi
          fi
          # O predicado precisa ser o único: uma política com o nome certo e o
          # corpo escrito à mão passaria pela verificação acima e divergiria da
          # regra de grupo econômico sem que nada acusasse.
          if ! grep -q 'app.cliente_visivel' 0011_eixo_cliente.sql; then
            echo "::error::eixo de cliente sem o predicado app.cliente_visivel (ver D-01)"
            exit 1
          fi
          echo "eixo de cliente restringe, e usa o predicado único"

      - name: Contexto de cliente também é local à transação
        run: |
          # Mesmo raciocínio de app.tenant_id: um SET de sessão para
          # app.cliente_id sob pooler em modo transação vazaria o locatário
          # para a requisição seguinte de outro locatário.
          if [ -d apps/api/src ] && grep -rInE "set_config\(\s*'app\.cliente_id'[^)]*,\s*false\s*\)" apps/api/src; then
            echo "::error::set_config de app.cliente_id com is_local=false"
            exit 1
          fi
          echo "contexto de cliente sempre local à transação"
